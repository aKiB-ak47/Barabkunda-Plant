# Builds the Barabkunda Android app (unsigned). The app is signed separately and published at download/.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/android/**", ".github/workflows/android-app.yml"]

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Put the website inside the app (offline copy)
        run: |
          W=app/android/app/src/main/assets/www
          mkdir -p "$W/assets"
          cp index.html manifest.webmanifest "$W/"
          cp -r assets/* "$W/assets/"
          du -sh "$W"

      - name: Build
        working-directory: app/android
        run: gradle assembleRelease --no-daemon --stacktrace -PversionCode=$((100 + ${{ github.run_number }}))

      - name: Align and collect the signing tool
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p out
          "$BT/zipalign" -p -f 4 app/android/app/build/outputs/apk/release/app-release-unsigned.apk out/app-unsigned.apk
          "$BT/zipalign" -c -v 4 out/app-unsigned.apk | tail -1
          cp "$BT/lib/apksigner.jar" out/
          "$BT/aapt2" dump badging out/app-unsigned.apk | head -4 || true
          echo "${{ github.sha }} run ${{ github.run_number }} versionCode $((100 + ${{ github.run_number }}))" > out/BUILD.txt
          ls -la out

      - name: Hand the unsigned app over for signing (branch app-build)
        run: |
          cd out
          git init -q -b app-build
          git config user.name "Akib Fateh"
          git config user.email "297658632+aKiB-ak47@users.noreply.github.com"
          git add -A
          git commit -q -m "Unsigned Android build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" app-build

      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: out/
